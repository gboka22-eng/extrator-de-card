<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>bklogins - Extrator PRO</title>
    <!-- Fonte Premium Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #141414;
            color: #ffffff;
            padding-bottom: 90px; 
            overflow-x: hidden;
            user-select: none;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        .view {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .netflix-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .logo-grupo {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .logo-bklogins {
            color: #E50914;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: lowercase;
        }
        .versao-tag {
            color: #888;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-sub {
            background-color: #E50914;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .instrucoes {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .seletor-modo-container {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .radio-modo {
            display: none;
        }
        .label-modo {
            flex: 1;
            padding: 10px 12px;
            background: #222;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #aaa;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .radio-modo:checked + .label-modo {
            background: #E50914;
            color: #fff;
            border-color: #E50914;
        }

        .box-status-import {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            background: #181818;
            padding: 10px 12px;
            border: 1px solid #333;
            border-radius: 6px;
        }
        .box-status-import label {
            font-size: 12px;
            font-weight: 700;
            color: #ccc;
            white-space: nowrap;
        }
        .select-import-status {
            flex: 1;
            background-color: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .select-import-status:focus {
            border-color: #E50914;
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 13px;
            background-color: #181818;
            color: #fff;
            resize: vertical;
            outline: none;
            font-family: monospace;
            transition: border-color 0.2s;
            user-select: text;
        }
        textarea:focus, input[type="text"]:focus, input[type="password"]:focus {
            border-color: #E50914;
        }
        .btn-processar {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            background-color: #E50914;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, transform 0.1s;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .btn-processar:active {
            background-color: #B81D24;
            transform: scale(0.99);
        }

        .painel-ferramentas {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-pesquisa {
            flex: 1;
            min-width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #181818;
            color: #fff;
            user-select: text;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .grupo-botoes-filtros {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
        }
        .btn-filtro-usados, .btn-backup {
            flex: 1 1 30%;
            min-width: 90px;
            padding: 10px 8px;
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .btn-filtro-usados.ativo {
            background-color: #E50914;
            border-color: #E50914;
        }
        .btn-backup:hover {
            background-color: #444;
        }

        /* CARD PASTA ASSINADAS & PAINEL BACKUP */
        .card-pasta-assinadas, .box-auto-backup {
            margin-top: 20px;
            background: #1a1a1a;
            border: 2px solid #34c759;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(52, 199, 89, 0.15);
        }
        .box-auto-backup {
            border-color: #007aff;
            box-shadow: 0 4px 18px rgba(0, 122, 255, 0.15);
            padding: 16px;
        }
        .cabecalho-pasta-assinadas {
            padding: 14px 16px;
            background: rgba(52, 199, 89, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .titulo-pasta-assinadas {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 800;
            color: #34c759;
        }
        .conteudo-pasta-assinadas {
            padding: 12px;
            background: #121212;
            display: none;
            border-top: 1px solid #282828;
        }
        .card-pasta-assinadas.aberto .conteudo-pasta-assinadas {
            display: block;
        }
